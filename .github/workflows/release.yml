name: Release skills

on:
  push:
    branches: [main]
    paths:
      - "goodsender*/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package every skill
        id: package
        run: |
          set -euo pipefail
          mkdir dist
          notes=""
          for dir in goodsender*/; do
            skill="${dir%/}"
            [ -f "${skill}/SKILL.md" ] || continue
            version=$(.github/scripts/skill-version.sh < "${skill}/SKILL.md")
            # The ZIP holds the skill folder itself, as Claude's upload expects.
            zip -r -q "dist/${skill}-${version}.zip" "${skill}" -x '*.DS_Store'
            cp "dist/${skill}-${version}.zip" "dist/${skill}-latest.zip"
            notes+="- \`${skill}\` ${version}"$'\n'
          done
          ls -l dist
          {
            echo "notes<<NOTES_EOF"
            printf '%s' "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.package.outputs.notes }}
        run: |
          set -euo pipefail
          tag="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release create "$tag" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "$NOTES" \
            --latest
